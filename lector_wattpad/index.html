<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Sagas Literarias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Barra superior de lectura Wattpad -->
  <header class="reader-header">
    <div class="brand-section">
      <div class="brand-logo">W</div>
      <span class="brand-title">SagaReader</span>
    </div>

    <!-- Selectores en Cascada: Saga -> Libro -> Capítulo -->
    <div class="selector-cascade">
      <div id="sagaWrap" class="custom-select-wrap" title="Seleccionar Saga">
        <select id="sagaSelect" aria-label="Seleccionar Saga"></select>
      </div>

      <div id="bookWrap" class="custom-select-wrap" title="Seleccionar Libro">
        <select id="bookSelect" aria-label="Seleccionar Libro"></select>
      </div>

      <div id="chapterWrap" class="custom-select-wrap chapter-select-wrap" title="Seleccionar Capítulo">
        <select id="chapterSelect" aria-label="Seleccionar Capítulo"></select>
      </div>
    </div>

    <!-- Controles de tipografía, accesibilidad TTS y tema visual -->
    <div id="readerControls" class="reader-controls">
      <button id="ttsPlayBtn" class="ctrl-btn tts-btn" title="Escuchar capítulo en voz alta (Texto a Voz)">
        <span class="tts-icon">🔊</span> <span id="ttsBtnLabel">Escuchar</span>
      </button>
      <button id="zoomOutBtn" class="ctrl-btn" title="Reducir fuente">A-</button>
      <button id="zoomInBtn" class="ctrl-btn" title="Aumentar fuente">A+</button>
      <button id="themeBtn" class="ctrl-btn" title="Cambiar tema (Oscuro/Sepia/Claro)">🌓 Tema</button>
    </div>

    <!-- Botón flotante a la derecha para colapsar/expandir en modo scroll -->
    <button id="headerCollapseBtn" class="header-collapse-btn" title="Mostrar/Ocultar controles de lectura" aria-label="Mostrar u ocultar controles">
      <span class="collapse-icon">▾</span>
    </button>
  </header>

  <!-- Barra flotante de control de Audio/TTS -->
  <aside id="ttsPanel" class="tts-panel" aria-label="Controles de audio y voz" hidden>
    <div class="tts-panel-content">
      <div class="tts-status">
        <span class="tts-wave-anim">
          <span></span><span></span><span></span><span></span>
        </span>
        <span id="ttsStatusText">Listo para leer en voz alta</span>
      </div>

      <div class="tts-actions">
        <button id="ttsPauseResumeBtn" class="tts-sub-btn" title="Pausar / Reanudar">⏸️</button>
        <button id="ttsStopBtn" class="tts-sub-btn" title="Detener audio">⏹️</button>
        
        <div class="tts-setting">
          <label for="ttsRateSelect">Vel:</label>
          <select id="ttsRateSelect">
            <option value="0.8">0.8x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.2">1.2x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>

        <div class="tts-setting">
          <label for="ttsVoiceSelect">Voz:</label>
          <select id="ttsVoiceSelect" class="tts-voice-select"></select>
        </div>

        <button id="ttsCloseBtn" class="tts-close-btn" title="Ocultar barra de voz">✕</button>
      </div>
    </div>
  </aside>

  <!-- Indicador visual de progreso según desplazamiento -->
  <div class="progress-bar-container">
    <div id="readingProgress" class="reading-progress"></div>
  </div>

  <!-- Escenario central de lectura literaria -->
  <main class="reader-stage">
    <article class="story-container">
      
      <!-- Metadatos superiores -->
      <header class="chapter-meta">
        <span id="chapterBadge" class="badge-tag">Saga</span>
        <h1 id="chapterTitle" class="chapter-headline">Cargando...</h1>
        <div id="readingTime" class="reading-time-est">Calculando tiempo de lectura...</div>
      </header>

      <!-- Cuerpo de la prosa literaria -->
      <section id="storyBody" class="story-body">
        <!-- Renderizado dinámico de la prosa -->
      </section>

      <!-- Botones de cambio de capítulo estilo Wattpad -->
      <nav class="navigation-bar" aria-label="Navegación entre capítulos">
        <button id="prevChapterBtn" class="nav-arrow-btn" disabled>
          <span>←</span> Anterior
        </button>

        <span id="chapterCounter" class="chapter-counter-pill">Capítulo</span>

        <button id="nextChapterBtn" class="nav-arrow-btn">
          Siguiente <span>→</span>
        </button>
      </nav>

    </article>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
